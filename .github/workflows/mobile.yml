name: Mobile (Flutter)

# Hanya berjalan jika kode aplikasi mobile atau kasus uji bersama berubah.
on:
  push:
    paths:
      - "mobile/**"
      - "shared/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "shared/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Android lint (AGP 9) butuh Java 21; Java 17 gagal di lintVitalAnalyzeRelease.
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Konfigurasi Supabase dari GitHub → Settings → Secrets and variables → Actions → Variables
      # (SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SITE_URL). Nilainya bukan rahasia.
      - name: Tulis env.json
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          jq -n --arg u "$SUPABASE_URL" --arg k "$SUPABASE_PUBLISHABLE_KEY" --arg s "${SITE_URL:-https://example.com}" \
            '{SUPABASE_URL: $u, SUPABASE_PUBLISHABLE_KEY: $k, SITE_URL: $s}' > env.json

      # Kunci tanda tangan release (opsional) dari Secrets. Tanpa ini APK ditandatangani
      # kunci debug runner, sehingga tidak bisa dipasang menimpa APK dari build lain.
      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=app/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter build apk --release --dart-define-from-file=env.json

      - uses: actions/upload-artifact@v4
        with:
          name: jeniusacademy-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
